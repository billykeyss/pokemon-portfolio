# Render Blueprint — pokemon-resume
# https://render.com/docs/blueprint-spec
#
# Deploys the Next.js static export (`output: "export"` in next.config.js)
# as a Render static site. Connect this repo at https://dashboard.render.com/
# → "New" → "Blueprint" → pick this branch.

services:
  - type: web
    name: resume
    runtime: static
    branch: main
    autoDeploy: true
    pullRequestPreviewsEnabled: true

    # Pin pnpm explicitly instead of using corepack: corepack pulls pnpm 11
    # (latest) by default, which can fail on Render (signing-key verification
    # errors, and pnpm 11 rejecting this pnpm-10 lockfile under --frozen-lockfile).
    # This mirrors the install step used by our other working Render services.
    # `next build` writes the static site to ./out (because of `output: "export"`).
    buildCommand: npm install -g pnpm@10.11.0 && pnpm install --frozen-lockfile && pnpm run build
    staticPublishPath: ./out

    envVars:
      - key: NODE_VERSION
        value: 22.13.1

    # No rewrites. `trailingSlash: true` in next.config.js makes the export
    # emit out/<route>/index.html, which Render serves for /<route> natively.
    #
    # There used to be a catch-all rewriting /* to /:splat.html. It never
    # worked: every extensionless path came back as an empty 200, including
    # paths that do not exist, so the site was only reachable at / and at
    # explicit .html URLs. Directory indexes need no rule at all.

    # Security + caching headers
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      # Long-cache the hashed Next.js asset bundles (filename includes a hash).
      - path: /_next/static/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      # Long-cache project image assets that don't change often.
      - path: /projects/*
        name: Cache-Control
        value: public, max-age=86400
