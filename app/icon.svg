<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32" shape-rendering="geometricPrecision">
  <defs>
    <clipPath id="ball">
      <circle cx="16" cy="16" r="14" />
    </clipPath>
  </defs>
  <!-- Outer rim -->
  <circle cx="16" cy="16" r="15" fill="#1B1F2B" />
  <!-- Hemispheres -->
  <g clip-path="url(#ball)">
    <rect x="0" y="0"  width="32" height="16" fill="#FF4D4D" />
    <rect x="0" y="16" width="32" height="16" fill="#FFFFFF" />
  </g>
  <!-- Equator band -->
  <rect x="1" y="14" width="30" height="4" fill="#1B1F2B" />
  <!-- Center button -->
  <circle cx="16" cy="16" r="4.6" fill="#1B1F2B" />
  <circle cx="16" cy="16" r="3.3" fill="#FFFFFF" />
  <circle cx="16" cy="16" r="1.4" fill="#1B1F2B" />
  <!-- Subtle highlight -->
  <circle cx="13.8" cy="13.8" r="0.7" fill="rgba(255,255,255,0.65)" />
</svg>
